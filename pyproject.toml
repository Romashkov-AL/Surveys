[project]
name = "surveys-ugc"
version = "0.1.0"
description = "Сервис создания опросов для пользователей."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "adrf==0.1.14",
    "django==6.1.3",
    "django-cors-headers==4.9.0",
    "djangorestframework==3.18.3",
    "psycopg[binary]==3.3.8",
    "uvicorn==0.54.0",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-django==4.14.0",
]
