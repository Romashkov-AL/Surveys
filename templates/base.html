{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Портал опросов{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container position-relative">
      <a class="navbar-brand" href="{% url 'surveys:index' %}">Портал опросов</a>
      <a class="nav-link text-white position-absolute top-50 start-50 translate-middle"
         href="{% url 'surveys:create' %}">Создать опрос</a>
      <div class="d-flex align-items-center ms-auto">
        <div class="input-group input-group-sm">
          <span class="input-group-text">Никнейм:</span>
          <input id="user-id-input" type="text" class="form-control" placeholder="никнейм" autocomplete="username" size="12">
        </div>
      </div>
    </div>
  </nav>
  <main class="container pb-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        {% block content %}{% endblock %}
      </div>
    </div>
  </main>
  <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'surveys/identity.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
