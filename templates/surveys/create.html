{% extends 'base.html' %}
{% block title %}Новый опрос{% endblock %}
{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h1 class="h3">Новый опрос</h1>
    <form id="create-form" class="d-grid gap-3">
      <div>
        <label class="form-label" for="title">Название</label>
        <input id="title" name="title" class="form-control" required maxlength="255" placeholder="Парам-пам-пам">
      </div>
      <div id="questions" class="d-grid gap-3"></div>
      <div class="d-flex gap-2">
        <button type="button" id="add-question" class="btn btn-outline-secondary">+ вопрос</button>
        <button type="submit" class="btn btn-primary">Сохранить</button>
      </div>
    </form>
    <pre id="create-result" class="alert alert-secondary mt-3 mb-0 small" hidden></pre>
  </div>
</div>
{% endblock %}
{% block scripts %}
{% load static %}
<script src="{% static 'surveys/create.js' %}"></script>
{% endblock %}
